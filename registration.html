<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Registration</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background: #f3f4f6; }
        .form-box { background:white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Event Registration</h2>
    <form id="regForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="Name@example.com">
        </div>

        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" required>
                <option value="" disabled selected>Select your Role</option>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="hod">HOD</option>
            </select>
        </div>

        <button type="submit">Register Now</button>
    </form>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Stop the page from refreshing
        alert('Registration Successful!'); // Simple popup notification
        this.reset(); // Clear the form fields
    });
</script>

</body>
</html>
